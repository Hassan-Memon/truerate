name: CI
on:
  push:
    branches: [master]
  pull_request:

# Least privilege: the token can read the repo and nothing else.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '${{ matrix.node }}'
      - run: npm test
      - name: Worker bundles cleanly
        if: matrix.node == 22
        # Pinned exactly: an unpinned `npx wrangler@4` would execute whatever
        # Cloudflare published most recently inside this job.
        run: npx --yes wrangler@4.158.0 deploy --dry-run --outdir dist
