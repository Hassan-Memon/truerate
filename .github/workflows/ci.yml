name: CI
on:
  push:
    branches: [master]
  pull_request:

# Least privilege: the token can read the repo and nothing else.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '${{ matrix.node }}'
      - run: npm test
      - name: Worker bundles cleanly
        if: matrix.node == 22
        # Pinned exactly: an unpinned `npx wrangler@4` would execute whatever
        # Cloudflare published most recently inside this job.
        run: npx --yes wrangler@4.158.0 deploy --dry-run --outdir dist
