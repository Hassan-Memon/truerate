name: Deploy to Cloudflare Workers
on:
  push:
    branches: [master]
  workflow_dispatch:

# Least privilege at the workflow level; the deploy job adds nothing, because
# Cloudflare auth comes from its own API token, not from GITHUB_TOKEN.
permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Opt-in switch: a merge to master never deploys until you set
    #   gh variable set DEPLOY_ENABLED --body true
    if: ${{ vars.DEPLOY_ENABLED == 'true' }}
    environment: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: npm test
      - uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # Pinned exactly, for the same reason as in ci.yml.
          wranglerVersion: '4.158.0'
