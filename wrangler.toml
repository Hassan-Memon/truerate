name = "truerate"
main = "src/worker.js"
compatibility_date = "2025-09-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

[assets]
directory = "./public"
binding = "ASSETS"
not_found_handling = "404-page"
# Without this, Workers Assets serves files directly and never invokes the
# Worker, so the security headers in src/core/headers.js would only reach /api/*.
run_worker_first = true

[observability]
enabled = true
